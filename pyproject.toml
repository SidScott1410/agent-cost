[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcost"
version = "0.1.0"
description = "What did your agent run cost, and how much of it was waste. No server, no account."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Sidney Scott", email = "sidney@reckonresearch.com" }]
keywords = ["llm", "agents", "cost", "tokens", "claude-code", "openai"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
live = ["tokenprice>=0.1"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
agentcost = "agentcost.cli:main"

[project.urls]
Homepage = "https://github.com/reckonresearch/agent-cost"
Issues = "https://github.com/reckonresearch/agent-cost/issues"

[tool.setuptools.packages.find]
include = ["agentcost*"]

[tool.ruff]
line-length = 120
